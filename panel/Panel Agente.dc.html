<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/styles.css">
<style>
body{margin:0;background:var(--surface-page)}
a{color:var(--text-accent);text-decoration:none}
a:hover{color:var(--cobalt-500);text-decoration:underline}
button{font-family:inherit}
input,select{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-default);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="display:flex;flex-direction:{{ dir }};height:100vh;background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans)">
  <sc-if value="{{ ancho }}" hint-placeholder-val="{{ true }}">
    <aside style="width:212px;flex:none;background:var(--surface-sunken);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;padding:var(--space-6) var(--space-4)">
      <div style="display:flex;flex-direction:column;gap:4px;padding:0 var(--space-4) var(--space-7)">
        <span style="font:600 17px/1 var(--font-sans);letter-spacing:-0.04em;color:var(--text-strong)">Mostrador<span style="color:var(--cobalt-500)">.</span></span>
        <span style="font:var(--text-caption);color:var(--text-muted)">Distribuidora Occidente</span>
      </div>
      <nav style="display:flex;flex-direction:column;gap:2px">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
          <button onClick="{{ n.ir }}" style="display:flex;align-items:center;gap:var(--space-5);height:32px;padding:0 var(--space-4);border:0;border-radius:var(--radius-sm);cursor:pointer;text-align:left;font:var(--text-label);color:{{ n.color }};background:{{ n.bg }};box-shadow:{{ n.sombra }}">
            <i class="{{ n.icono }}" style="font-size:16px;color:{{ n.colorIcono }}"></i>
            <span style="flex:1">{{ n.label }}</span>
            <span style="font:500 11.5px/1 var(--font-sans);font-variant-numeric:tabular-nums;color:var(--text-muted)">{{ n.badge }}</span>
          </button>
        </sc-for>
      </nav>
      <div style="margin-top:auto;display:flex;flex-direction:column;gap:var(--space-5);padding:var(--space-5) var(--space-4) 0;border-top:1px solid var(--border-subtle)">
        <div style="display:flex;flex-direction:column;gap:3px">
          <div style="display:flex;align-items:center;gap:6px;font:var(--text-caption);color:var(--text-strong)"><span style="width:7px;height:7px;border-radius:50%;background:var(--status-success)"></span>Agente en línea</div>
          <div style="font:var(--text-caption);color:var(--text-muted)">{{ modoErp }}</div>
        </div>
        <div style="display:flex;align-items:center;gap:var(--space-4)">
          <i class="ph ph-user-circle" style="font-size:22px;color:var(--text-muted)"></i>
          <div style="flex:1;min-width:0">
            <div style="font:var(--text-caption);color:var(--text-strong)">Karla Medina</div>
            <div style="font:var(--text-caption);color:var(--text-muted)">Mesa de control</div>
          </div>
          <button onClick="{{ alternarTema }}" title="Cambiar tema" style="width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--border-default);border-radius:var(--radius-sm);background:var(--surface-card);color:var(--text-body);cursor:pointer"><i class="{{ iconoTema }}" style="font-size:14px"></i></button>
        </div>
      </div>
    </aside>
  </sc-if>
  <sc-if value="{{ angosto }}" hint-placeholder-val="{{ false }}">
    <header style="flex:none;display:flex;align-items:center;gap:var(--space-4);padding:var(--space-4) var(--space-5);background:var(--surface-sunken);border-bottom:1px solid var(--border-subtle);overflow-x:auto">
      <span style="font:600 15px/1 var(--font-sans);letter-spacing:-0.04em;color:var(--text-strong);margin-right:var(--space-3)">Mostrador<span style="color:var(--cobalt-500)">.</span></span>
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
        <button onClick="{{ n.ir }}" style="flex:none;display:flex;align-items:center;gap:6px;height:32px;padding:0 var(--space-4);border:0;border-radius:var(--radius-sm);font:var(--text-label);color:{{ n.color }};background:{{ n.bg }};box-shadow:{{ n.sombra }};cursor:pointer">
          <i class="{{ n.icono }}" style="font-size:15px;color:{{ n.colorIcono }}"></i>{{ n.label }}<span style="font:500 11px/1 var(--font-sans);color:var(--text-muted)">{{ n.badge }}</span>
        </button>
      </sc-for>
      <button onClick="{{ alternarTema }}" style="flex:none;margin-left:auto;width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--border-default);border-radius:var(--radius-sm);background:var(--surface-card);color:var(--text-body)"><i class="{{ iconoTema }}"></i></button>
    </header>
  </sc-if>
  <main style="flex:1;min-width:0;min-height:0;overflow:auto;position:relative">
    <sc-if value="{{ cargando }}" hint-placeholder-val="{{ false }}">
      <div style="padding:var(--space-9);font:var(--text-body-sm);color:var(--text-muted)">Cargando pedidos…</div>
    </sc-if>
    <sc-if value="{{ vBandeja }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Bandeja" pedidos="{{ pendientes }}" seleccion="{{ sel }}" on-sel="{{ onSel }}" on-resolver="{{ onResolver }}" on-abrir="{{ onAbrir }}" aprobados-hoy="{{ aprobadosHoy }}" densidad="{{ densidad }}" style="height:100%" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ vConversacion }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Conversacion" pedido="{{ pedidoAbierto }}" traza="{{ trazaAbierta }}" estado="{{ estadoAbierto }}" on-volver="{{ onVolver }}" on-resolver="{{ onResolverAbierto }}" style="height:100%" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ vTablero }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Tablero" datos="{{ datos }}" hint-size="100%,900px"></dc-import>
    </sc-if>
    <sc-if value="{{ vCatalogo }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Catalogo" datos="{{ datos }}" hint-size="100%,900px"></dc-import>
    </sc-if>
    <sc-if value="{{ vInventario }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Inventario" datos="{{ datos }}" hint-size="100%,900px"></dc-import>
    </sc-if>
    <sc-if value="{{ vVivo }}" hint-placeholder-val="{{ false }}">
      <dc-import name="EnVivo" datos="{{ datos }}" style="height:100%" hint-size="100%,100%"></dc-import>
    </sc-if>
  </main>
  <sc-if value="{{ hayToast }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:var(--space-6);padding:10px 10px 10px 16px;background:var(--surface-inverse);color:var(--text-inverse);border-radius:var(--radius-lg);box-shadow:var(--shadow-overlay);font:var(--text-body-sm);animation:entra 160ms var(--ease-out);max-width:calc(100vw - 32px)">
      <i class="{{ toast.icono }}" style="font-size:16px;color:{{ toast.color }}"></i>
      <span>{{ toast.texto }}</span>
      <button onClick="{{ deshacer }}" style="display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border:1px solid color-mix(in srgb,var(--text-inverse) 25%,transparent);border-radius:var(--radius-sm);background:transparent;color:var(--text-inverse);font:var(--text-label);cursor:pointer">Deshacer<span style="font:500 11px/1 var(--font-mono);opacity:.7">Z</span></button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;tema&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;claro&quot;,&quot;oscuro&quot;],&quot;default&quot;:&quot;claro&quot;,&quot;tsType&quot;:&quot;'claro'|'oscuro'&quot;},&quot;densidad&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;compacta&quot;,&quot;cómoda&quot;],&quot;default&quot;:&quot;compacta&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pantallaInicial&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Bandeja&quot;,&quot;Tablero&quot;,&quot;Catálogo&quot;,&quot;Inventario&quot;,&quot;En vivo&quot;],&quot;default&quot;:&quot;Bandeja&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;escrituraErp&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;con_aprobacion&quot;,&quot;automatica&quot;],&quot;default&quot;:&quot;con_aprobacion&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { d: null, vista: null, sel: null, abierto: null, estados: {}, historial: [], toast: null, tema: null, w: window.innerWidth };
  trazas = {};
  componentDidMount() {
    import(new URL('./datos.js', location.href).href).then(d => this.setState({ d }));
    this.onResize = () => this.setState({ w: window.innerWidth });
    this.onKey = e => {
      if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey) return;
      if (e.key.toLowerCase() === 'z' && this.state.historial.length) { e.preventDefault(); this.deshacer(); }
    };
    window.addEventListener('resize', this.onResize);
    window.addEventListener('keydown', this.onKey);
    this.aplicarTema();
  }
  componentDidUpdate() { this.aplicarTema(); }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); window.removeEventListener('keydown', this.onKey); }
  tema() { return this.state.tema ?? (this.props.tema === 'oscuro' ? 'dark' : 'light'); }
  aplicarTema() { document.documentElement.dataset.theme = this.tema(); }
  vista() { return this.state.vista ?? ({ Tablero: 'tablero', Catálogo: 'catalogo', Inventario: 'inventario', 'En vivo': 'vivo' }[this.props.pantallaInicial] || 'bandeja'); }
  estado(folio) { return this.state.estados[folio] || 'por_aprobar'; }
  resolver(folios, estado, cambios) {
    const prev = folios.map(f => [f, this.state.estados[f]]);
    const n = folios.length;
    const txt = estado === 'confirmado'
      ? (n > 1 ? `${n} pedidos aprobados y enviados al ERP` : `${folios[0]} aprobado${cambios && Object.keys(cambios).length ? ' con cambios' : ''} y enviado al ERP`)
      : `${folios[0]} rechazado. Material apartado liberado`;
    this.setState(s => ({
      estados: { ...s.estados, ...Object.fromEntries(folios.map(f => [f, estado])) },
      historial: [...s.historial, prev],
      toast: { texto: txt, icono: estado === 'confirmado' ? 'ph-fill ph-check-circle' : 'ph-fill ph-x-circle', color: estado === 'confirmado' ? 'var(--green-100)' : 'var(--red-100)' }
    }));
    clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast: null }), 6000);
  }
  deshacer() {
    const h = [...this.state.historial]; const ult = h.pop(); if (!ult) return;
    const estados = { ...this.state.estados };
    ult.forEach(([f, e]) => { if (e) estados[f] = e; else delete estados[f]; });
    this.setState({ estados, historial: h, toast: null, sel: ult[0][0] });
  }
  renderVals() {
    const d = this.state.d, v = this.vista(), angosto = this.state.w < 820;
    const pendientes = d ? d.pedidos.filter(p => this.estado(p.folio) === 'por_aprobar') : [];
    const aprobadosHoy = d ? 23 + d.pedidos.filter(p => this.estado(p.folio) === 'confirmado').length : 0;
    const ir = vista => () => this.setState({ vista, abierto: null });
    const items = [
      ['bandeja', 'Bandeja', 'ph-tray', String(pendientes.length || '')],
      ['tablero', 'Tablero', 'ph-chart-bar', ''],
      ['catalogo', 'Catálogo', 'ph-list-magnifying-glass', ''],
      ['inventario', 'Inventario', 'ph-package', ''],
      ['vivo', 'En vivo', 'ph-phone-call', '3'],
    ];
    const nav = items.map(([k, label, ic, badge]) => {
      const on = k === v || (k === 'bandeja' && v === 'conversacion');
      return { label, badge, ir: ir(k), icono: (on ? 'ph-fill ' : 'ph ') + ic, color: on ? 'var(--text-strong)' : 'var(--text-body)', colorIcono: on ? 'var(--surface-accent)' : 'currentColor', bg: on ? 'var(--surface-card)' : 'transparent', sombra: on ? 'var(--shadow-raised)' : 'none' };
    });
    const ab = d && this.state.abierto ? d.pedidos.find(p => p.folio === this.state.abierto) : null;
    if (ab && !this.trazas[ab.folio]) this.trazas[ab.folio] = d.traza(ab);
    return {
      dir: angosto ? 'column' : 'row', ancho: !angosto, angosto, nav,
      modoErp: this.props.escrituraErp === 'automatica' ? 'Escritura al ERP: automática' : 'Escritura al ERP: con aprobación',
      iconoTema: this.tema() === 'dark' ? 'ph ph-sun' : 'ph ph-moon',
      alternarTema: () => this.setState({ tema: this.tema() === 'dark' ? 'light' : 'dark' }),
      cargando: !d, datos: d, densidad: this.props.densidad ?? 'compacta',
      vBandeja: !!d && v === 'bandeja', vConversacion: !!d && v === 'conversacion' && !!ab,
      vTablero: !!d && v === 'tablero', vCatalogo: !!d && v === 'catalogo', vInventario: !!d && v === 'inventario', vVivo: !!d && v === 'vivo',
      pendientes, aprobadosHoy, sel: this.state.sel,
      onSel: f => this.setState({ sel: f }),
      onResolver: (f, e, c) => this.resolver(f, e, c),
      onAbrir: f => this.setState({ abierto: f, sel: f, vista: 'conversacion' }),
      pedidoAbierto: ab, trazaAbierta: ab ? this.trazas[ab.folio] : null, estadoAbierto: ab ? this.estado(ab.folio) : null,
      onVolver: () => this.setState({ vista: 'bandeja', abierto: null }),
      onResolverAbierto: e => {
        const l = pendientes; const i = l.findIndex(p => p.folio === ab.folio); const sig = l[i + 1] || l[i - 1];
        this.resolver([ab.folio], e); this.setState({ vista: 'bandeja', abierto: null, sel: sig?.folio });
      },
      hayToast: !!this.state.toast, toast: this.state.toast || {}, deshacer: () => this.deshacer(),
    };
  }
}
</script>
</body>
</html>
